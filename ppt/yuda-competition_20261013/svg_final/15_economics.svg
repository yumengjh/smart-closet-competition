<g id="title" data-pptx-bounds="64 44 1152 152" fill="#302238"><text x="64" y="72" font-size="18">UNIT ECONOMICS / 情景演算</text><text x="64" y="145" font-family="SimSun, Georgia" font-size="48">先算清一位用户，再放大市场。</text></g>
<g id="inputs" data-pptx-bounds="64 232 600 245" fill="#302238"><text x="64" y="294" font-size="56" font-weight="bold">10,000</text><text x="64" y="336" font-size="20" fill="#6B6071">活跃用户 / 假设</text><line x1="284" y1="287" x2="361" y2="287" stroke="#302238" stroke-width="2" marker-end="url(#arrow)"/><text x="280" y="253" font-size="20">5% 转化</text><text x="403" y="294" font-size="56" font-weight="bold">500</text><text x="403" y="336" font-size="20" fill="#6B6071">年费会员 / 假设</text><line x1="64" y1="379" x2="632" y2="379" stroke="#C7BECC"/><text x="64" y="437">价格假设：<tspan font-weight="bold">199 元 / 人 / 年</tspan></text></g>
<g id="annual" data-pptx-bounds="713 232 503 245" fill="#F5F1E8"><rect x="713" y="232" width="503" height="245" fill="#302238"/><text x="740" y="280" font-size="20" fill="#D8F36A">年订阅收入 / 情景数据</text><text x="740" y="386" font-size="88" font-weight="bold">9.95</text><text x="1002" y="382" font-size="36" font-family="SimSun, Georgia">万元</text><text x="740" y="449" font-size="20">不是预测，也不是净利润。</text></g>
<g id="costs" data-pptx-bounds="64 515 1152 108" fill="#302238"><text x="64" y="547">尚未扣除：获客 · 服务器 · 存储 · 支持 · 税费</text><text x="64" y="598" font-size="20">生成额度单列成本；推荐无远程模型决策费，仍需承担本地计算成本。</text></g>
<g id="footer" data-pptx-bounds="64 648 1152 50" fill="#6B6071" font-size="16"><text x="64" y="665">全部商业数字为示意假设；无现有用户、正式价格或收入证据。</text><text x="64" y="690">先验证转化、留存与单位成本，再决定扩张。</text><text x="1178" y="690">15</text></g>
